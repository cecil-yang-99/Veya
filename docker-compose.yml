# Local development infrastructure for Veya.
# Usage: docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: veya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: veya
      POSTGRES_PASSWORD: veya_dev_password
      POSTGRES_DB: veya
    ports:
      - '5432:5432'
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veya -d veya']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is reserved for later phases (caching, queues, rate limiting).
  # It is not required by the current backend modules.
  redis:
    image: redis:7-alpine
    container_name: veya-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    profiles:
      - full
